# Course map: the single source of truth for lectures, seminars, the topics they
# cover and the exam questions they prepare for (Plan 3). Read by
# `taskgen course check|scaffold|examples|docs|book` and by the Makefile.
#
# Directories follow the numbers here:
#   materials/sem<N>/lectures/<NN>-<slug>/   notes.tex (+ notes-body.tex), slides.tex,
#                                            examples.yaml -> examples/*.tex (taskgen)
#   materials/sem<N>/seminars/<NN>-<slug>/   handout.tex
#   sheets/sem<N>/seminar-<NN>-<slug>.yaml   classroom task sheet (default `sheet`)
#
# topics:          task taxonomy slugs (taskgen/tasks/taxonomy.yaml) the lecture covers
# exam_questions:  "sem<N>:<k>" — number k of that semester's question list; a combined
#                  question "14-15" counts as both numbers
# legacy_deck:     the PPTX deck the slides were ported from (tmp/ is not committed)
# draft: true      work in progress: missing files are warnings, not errors

semesters:
  - n: 1
    title: Арифметика больших чисел и элементы теории чисел
    exam: зачёт
    exam_questions: 22
    lectures:
      - n: 1
        slug: introduction
        title: Введение
        legacy_deck: "tmp/лекции/Lecture 1. Introduction.pptx"
      - n: 2
        slug: big-integer-arithmetic
        title: Арифметика больших чисел
        topics: [arithmetic.representation, arithmetic.complexity, arithmetic.multiplication]
        exam_questions: [sem1:1, sem1:5, sem1:6]
        legacy_deck: "tmp/лекции/Lecture 2. Арифметика больших чисел.src.pptx"
      - n: 3
        slug: division-and-euclid
        title: Деление с остатком и алгоритм Евклида
        topics: [arithmetic.division, number_theory.euclid]
        exam_questions: [sem1:1, sem1:12, sem1:13]
      - n: 4
        slug: convolutions-and-fft
        title: Свёртки и умножение с помощью БПФ
        topics: [arithmetic.convolution]
        exam_questions: [sem1:7, sem1:8, sem1:9]
      - n: 5
        slug: modular-arithmetic
        title: Модулярная арифметика. Метод Монтгомери, кольца Ферма и Мерсенна
        topics: [arithmetic.montgomery, arithmetic.modular, arithmetic.ntt]
        exam_questions: [sem1:3, sem1:10, sem1:11]
      - n: 6
        slug: exponentiation
        title: Быстрое возведение в степень
        topics: [powmod]
        exam_questions: [sem1:2, sem1:4]
      - n: 7
        slug: order-and-primitive-roots
        title: Порядок элемента и первообразные корни
        topics: [number_theory.order, number_theory.primitive_root]
        exam_questions: [sem1:14, sem1:15, sem1:16]
      - n: 8
