# Контрольная 3 (файл 04): пять тематических блоков, по одному заданию из каждого.
# Пресет kontrolnaya04 выравнивает длины сомножителей у Карацубы и Тоома--Кука.
# Условные правила гарантируют, что метод Монтгомери встречается в первых двух
# заданиях ровно один раз: либо умножение, либо бинарное возведение в степень.
id: sem1-kontrolnaya-04
kind: individual
title: Контрольная работа 3
semester: 1
intro: |
  Цель контрольной работы: определение уровня знаний по темам «Умножение больших чисел», «Быстрое возведение в степень», «Порядок элемента и обратный элемент», «Тесты простоты» и «Генераторы псевдослучайных чисел» (1-й семестр).

  Каждому студенту предназначен индивидуальный вариант, номер которого совпадает с номером студента в списке группы. Вариант состоит из пяти заданий.

  \textbf{Обратите внимание}: варианты для студентов группы n приведены в разделе «Варианты группы n»!

  Оценка $s$ вычисляется по формуле
  \[
  s = \begin{cases}
    0,&\textrm{$b < 2$,}\\
    3,&\textrm{$2 \leq b < 3{,}5$,}\\
    4,&\textrm{$3{,}5 \leq b < 4{,}5$,}\\
    5,&\textrm{$b \geq 4{,}5$,}
    \end{cases}
  \]
  где $b$ --- количество набранных баллов за задания.

  Критерии оценивания:
  \begin{itemize}
    \item если при выполнении задания студент верно и точно применил требуемый алгоритм, полно и понятно описал шаги и действия и получил верный ответ, задание оценивается одним баллом;
    \item если студент верно и точно применил требуемый алгоритм, полно и понятно описал шаги и действия, но получил неверный ответ из-за допущенной вычислительной ошибки, задание оценивается половиной балла;
    \item если студент верно и точно применил требуемый алгоритм, но не полно или не понятно описал шаги и действия, но получил верный ответ, задание также оценивается половиной балла;
    \item в случаях, когда решение не удовлетворяет изложенным выше требованиям, задание оценивается в 0 баллов.
  \end{itemize}

  При решении КР можно пользоваться всем, чем угодно, кроме помощи одногруппников.

groups:
  - {name: "6411", count: 42}
  - {name: "6412", count: 42}
  - {name: "6413", count: 42}

budget: {min: 7, max: 8}
distinct_families: true

rules:
  - when_slot: 0
    when_families: [karatsuba, toom]
    require_slot: 1
    tasks: [powmod.montgomery]
  - when_slot: 0
    when_families: [montgomery]
    require_slot: 1
    tasks: [powmod.binary]

slots:
  - title: Умножение
    tasks: [arithmetic.karatsuba@kontrolnaya04, arithmetic.toom_cook@kontrolnaya04,
            arithmetic.montgomery_mul]
  - title: Возведение в степень
    tasks: [powmod.binary, powmod.montgomery]
  - title: Порядок элемента и обратный элемент
    tasks: [number_theory.inverse, number_theory.batch_inverse, number_theory.order]
  - title: Тесты простоты
    tasks: [number_theory.miller_rabin, number_theory.solovay_strassen]
  - title: Генераторы псевдослучайных чисел
    tasks: [crypto.lcg_decrypt, crypto.lfsr_decrypt]
