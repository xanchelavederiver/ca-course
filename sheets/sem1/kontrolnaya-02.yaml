# 2nd контрольная of semester 1: Euclid and inverses, CRT, element orders,
# primitive roots, primality tests, and cryptographic applications. Eight slots
# cover all six blocks in every variant. The exact complexity budget equalizes
# the variants; distinct_families also prevents a repeated task within one.
id: sem1-kontrolnaya-02
kind: individual
title: Контрольная работа 2
semester: 1
intro: |
  Цель контрольной работы: определение уровня знаний по темам «Алгоритм Евклида и обратные элементы», «Китайская теорема об остатках», «Порядок элемента», «Первообразные корни», «Тесты простоты» и «Криптографические приложения» (1-й семестр).

  Каждому студенту предназначен индивидуальный вариант, номер которого совпадает с номером студента в списке группы. Вариант состоит из восьми заданий.

  \textbf{Обратите внимание}: варианты для студентов группы n приведены в разделе «Варианты группы n»!

  Оценка $s$ вычисляется по формуле
  \[
  s = \begin{cases}
    0,&\textrm{$b < 3$,}\\
    3,&\textrm{$3 \leq b < 5$,}\\
    4,&\textrm{$5 \leq b < 7$,}\\
    5,&\textrm{$b \geq 7$,}
    \end{cases}
  \]
  где $b$ --- количество набранных баллов за задания.

  Критерии оценивания:
  \begin{itemize}
    \item если при выполнении задания студент верно и точно применил требуемый алгоритм, полно и понятно описал шаги и действия и получил верный ответ, задание оценивается одним баллом;
    \item если студент верно и точно применил требуемый алгоритм, полно и понятно описал шаги и действия, но получил неверный ответ из-за допущенной вычислительной ошибки, задание оценивается половиной балла;
    \item если студент верно и точно применил требуемый алгоритм, но не полно или не понятно описал шаги и действия, но получил верный ответ, задание также оценивается половиной балла;
    \item в случаях, когда решение не удовлетворяет изложенным выше требованиям, задание оценивается в 0 баллов.
  \end{itemize}

  При решении КР можно пользоваться всем, чем угодно, кроме помощи одногруппников.

groups:
