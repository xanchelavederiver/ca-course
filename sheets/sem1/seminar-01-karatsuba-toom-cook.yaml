# Seminar 1 (lectures 2 and 6): big-integer representation, fast multiplication
# (Karatsuba and Toom-Cook with their variants) and fast exponentiation — every task
# of those topics.
# Warm-up -> core -> corner cases. Issue once per seminar: make issue SHEET=<this file>.
id: sem1-seminar-01-karatsuba-toom-cook
kind: classroom
title: Семинар 1. Умножение больших чисел
semester: 1
document:
  toc: false
intro: |
  Задачи для решения на семинаре. Справочный материал "--- в раздаточном листке семинара и
  в конспектах лекций~2 и~6.
sections:
  - title: Разминка
    intro: Представление чисел; сбалансированные цифры (в том числе для отрицательных чисел).
    tasks: [arithmetic.balanced_repr, arithmetic.balanced_repr]
  - title: Метод Карацубы
    intro: >-
      Классический метод, возведение в квадрат, вычитательный вариант ($z_1 = z_2 + z_0 -
      (x_1 - x_0)(y_1 - y_0)$ "--- разности не выходят за разрядную сетку половинок) и один
      шаг метода для многочленов (переносов нет: метод работает над любым кольцом
      коэффициентов).
    tasks: [arithmetic.karatsuba, arithmetic.karatsuba_square, arithmetic.karatsuba_sub,
            arithmetic.karatsuba_poly]
  - title: Метод Тоома--Кука
    intro: >-
      Классические точки интерполяции $0, 1, -1, 2, \infty$; в вариантах "--- другой набор
      точек (формулы восстановления нужно вывести заново) и сомножители разной длины
      (разбиение $3 \times 2$, четыре точки).
    tasks: [arithmetic.toom_cook, arithmetic.toom_points, arithmetic.toom_unbalanced]
  - title: Быстрое возведение в степень
    intro: >-
      Все методы раздела: бинарный, $4$-арный, скользящее окно, аддитивные цепочки и метод
      Монтгомери. Ведите таблицу промежуточных значений и проверяйте инвариант (текущее
      значение равно $a$ в степени уже прочитанной части показателя); сравнивайте число
      возведений в квадрат и умножений с учётом предвычисления. Среди задач есть особые
      случаи: показатель из длинных серий единиц (окна выгоднее всего), показатель "---
      степень двойки (предвычисление не окупается) и чётный модуль в методе Монтгомери
      ($R = 2^k$ не обратим: КТО).
    tasks: [powmod.binary, powmod.binary_mod, powmod.qary, powmod.qary_mod,
            powmod.sliding_window, powmod.sliding_window@runs, powmod.sliding_window@pow2,
            powmod.montgomery, powmod.montgomery_even, powmod.addition_chain]
  - title: Оценки сложности
    intro: >-
      Основная теорема о рекуррентных соотношениях; среди задач могут встретиться
      соотношения, к которым теорема неприменима.
    tasks: [arithmetic.master_theorem, arithmetic.master_theorem, arithmetic.master_theorem,
            arithmetic.master_theorem]
